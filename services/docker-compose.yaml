version: '3.8'

services:
  gateway-service:
    build: ./gateway-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ACCOUNT_SERVICE_URL=http://account-service:3001
      - PAYMENT_PROCESSOR_URL=http://payment-processor:3002
      - FX_SERVICE_URL=http://fx-service:3005
    depends_on:
      - account-service
      - payment-processor
      - fx-service

  account-service:
    build: ./account-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      - account-data:/app/data

  payment-processor:
    build: ./payment-processor
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - ACCOUNT_SERVICE_URL=http://account-service:3001
      - VALIDATION_SERVICE_URL=http://validation-service:3003
      - LEDGER_SERVICE_URL=http://ledger-service:3004
      - FX_SERVICE_URL=http://fx-service:3005
      - AUDIT_SERVICE_URL=http://audit-service:3006
    depends_on:
      - account-service
      - validation-service
      - ledger-service
      - fx-service
      - audit-service
    volumes:
      - payment-data:/app/data

  validation-service:
    build: ./validation-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
    volumes:
      - validation-data:/app/data

  ledger-service:
    build: ./ledger-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
    volumes:
      - ledger-data:/app/data

  fx-service:
    build: ./fx-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
    volumes:
      - fx-data:/app/data

  audit-service:
    build: ./audit-service
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
    volumes:
      - audit-data:/app/data

  payment-ui:
    build: ./payment-ui
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - API_URL=http://gateway-service:3000
    depends_on:
      - gateway-service

volumes:
  account-data:
  payment-data:
  validation-data:
  ledger-data:
  fx-data:
  audit-data:
