openapi: 3.1.0
info:
  title: Account Service API
  description: Manages accounts, balances, and account operations
  version: 1.0.0
  contact:
    name: Payment Platform Team

servers:
  - url: http://localhost:3001
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /accounts:
    get:
      summary: List all accounts
      operationId: listAccounts
      tags: [Accounts]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  count:
                    type: integer

    post:
      summary: Create a new account
      operationId: createAccount
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'

  /accounts/{accountId}:
    get:
      summary: Get account by ID
      operationId: getAccount
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounts/{accountId}/balance:
    get:
      summary: Get account balance
      operationId: getBalance
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/BalanceResponse'

  /accounts/{accountId}/debit:
    post:
      summary: Debit account
      operationId: debitAccount
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitCreditRequest'
      responses:
        '200':
          description: Account debited
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'

  /accounts/{accountId}/credit:
    post:
      summary: Credit account
      operationId: creditAccount
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebitCreditRequest'
      responses:
        '200':
          description: Account credited
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'

  /accounts/lookup/{accountNumber}/{bankCode}:
    get:
      summary: Lookup account by number and bank code
      operationId: lookupAccount
      tags: [Accounts]
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
        - name: bankCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
      description: Account identifier

  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          example: ACC001
        accountNumber:
          type: string
          example: GB82WEST12345698765432
        bankCode:
          type: string
          example: WESTGB2L
        holderName:
          type: string
          example: John Doe
        currency:
          type: string
          enum: [USD, EUR, GBP, SGD, JPY, CHF]
          example: GBP
        balance:
          type: number
          format: double
          example: 50000
        country:
          type: string
          example: GB
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
          example: ACTIVE
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAccountRequest:
      type: object
      required:
        - holderName
        - accountNumber
        - bankCode
        - currency
        - country
      properties:
        holderName:
          type: string
        accountNumber:
          type: string
        bankCode:
          type: string
          pattern: '^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$'
        currency:
          type: string
          enum: [USD, EUR, GBP, SGD, JPY, CHF]
        country:
          type: string
          minLength: 2
          maxLength: 2
        balance:
          type: number
          default: 0

    DebitCreditRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01

    BalanceResponse:
      type: object
      properties:
        accountId:
          type: string
        balance:
          type: number
          format: double
        currency:
          type: string
        asOf:
          type: string
          format: date-time

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: account-service
        timestamp:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

tags:
  - name: Health
    description: Health check endpoints
  - name: Accounts
    description: Account management operations
