openapi: 3.1.0
info:
  title: Audit Service API
  description: Compliance audit logging and audit trail service
  version: 1.0.0
  contact:
    name: Payment Platform Team

servers:
  - url: http://localhost:3006
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /events:
    get:
      summary: List audit events
      operationId: listEvents
      tags: [Events]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  count:
                    type: integer
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      summary: Log a new audit event
      operationId: logEvent
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogEventRequest'
      responses:
        '201':
          description: Event logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuditEvent'
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /events/{eventId}:
    get:
      summary: Get event by ID
      operationId: getEvent
      tags: [Events]
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit event
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuditEvent'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/types:
    get:
      summary: Get available event types
      operationId: getEventTypes
      tags: [Events]
      responses:
        '200':
          description: List of event types
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: string

  /events/payment/{paymentId}:
    get:
      summary: Get events for a payment
      operationId: getEventsByPayment
      tags: [Events]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit events for the payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  count:
                    type: integer

  /events/payment/{paymentId}/trail:
    get:
      summary: Get audit trail for a payment
      operationId: getPaymentAuditTrail
      tags: [Events]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Complete audit trail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AuditTrail'

  /events/account/{accountId}:
    get:
      summary: Get events for an account
      operationId: getEventsByAccount
      tags: [Events]
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit events for the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'

  /events/type/{eventType}:
    get:
      summary: Get events by type
      operationId: getEventsByType
      tags: [Events]
      parameters:
        - name: eventType
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit events of the specified type
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'

components:
  schemas:
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: string
          example: EVT-abc123-0001
        eventType:
          type: string
          example: PAYMENT_INITIATED
        entityType:
          type: string
          enum: [PAYMENT, ACCOUNT, SYSTEM]
          example: PAYMENT
        entityId:
          type: string
          example: PAY-20260902-A1B2C3
        actor:
          type: string
          example: PAYMENT_PROCESSOR
        action:
          type: string
          example: PAYMENT_INITIATED
        details:
          type: object
          description: Event-specific details
          example:
            amount: 1000
            currency: GBP
        previousState:
          type: object
          nullable: true
        newState:
          type: object
          nullable: true
        ipAddress:
          type: string
        integrityHash:
          type: string
          description: SHA256 hash for tamper detection
          example: bc7a28cd1ae6ee5361696cb2b11119fc7ae7cf347de04fc722ae81bba70f83a0
        createdAt:
          type: string
          format: date-time

    LogEventRequest:
      type: object
      required:
        - eventType
      properties:
        eventType:
          type: string
        entityType:
          type: string
          enum: [PAYMENT, ACCOUNT, SYSTEM]
          default: PAYMENT
        entityId:
          type: string
        actor:
          type: string
        action:
          type: string
        details:
          type: object
        previousState:
          type: object
        newState:
          type: object

    AuditTrail:
      type: object
      properties:
        paymentId:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        summary:
          type: object
          properties:
            totalEvents:
              type: integer
            firstEvent:
              type: string
              format: date-time
            lastEvent:
              type: string
              format: date-time
            eventTypes:
              type: array
              items:
                type: string

    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: audit-service
        timestamp:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

tags:
  - name: Health
    description: Health check endpoints
  - name: Events
    description: Audit event operations
