openapi: 3.1.0
info:
  title: Payment Processor API
  description: Core payment orchestration service for cross-border wire transfers
  version: 1.0.0
  contact:
    name: Payment Platform Team

servers:
  - url: http://localhost:3002
    description: Local development

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /payments:
    post:
      summary: Initiate a new payment
      operationId: createPayment
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      summary: List payments
      operationId: listPayments
      tags: [Payments]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  count:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /payments/{paymentId}:
    get:
      summary: Get payment by ID
      operationId: getPayment
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/{paymentId}/details:
    get:
      summary: Get payment with full details including audit trail
      operationId: getPaymentDetails
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment with full details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetails'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/status/{status}:
    get:
      summary: Get payments by status
      operationId: getPaymentsByStatus
      tags: [Payments]
      parameters:
        - name: status
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Payments with specified status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/PaymentStatus'
                  payments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  count:
                    type: integer

components:
  parameters:
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^PAY-\d{8}-[A-Z0-9]{6}$'
      description: Payment identifier
      example: PAY-20260902-A1B2C3

  schemas:
    CreatePaymentRequest:
      type: object
      required:
        - senderAccountNumber
        - senderBankCode
        - receiverAccountNumber
        - receiverBankCode
        - amount
        - currency
      properties:
        senderAccountNumber:
          type: string
          description: Sender's account number (IBAN)
          example: GB82WEST12345698765432
        senderBankCode:
          type: string
          description: Sender's bank SWIFT/BIC code
          pattern: '^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$'
          example: WESTGB2L
        receiverAccountNumber:
          type: string
          description: Receiver's account number (IBAN)
          example: DE89370400440532013000
        receiverBankCode:
          type: string
          description: Receiver's bank SWIFT/BIC code
          pattern: '^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$'
          example: COBADEFF
        amount:
          type: number
          format: double
          minimum: 0.01
          description: Amount to transfer
          example: 1000
        currency:
          type: string
          enum: [USD, EUR, GBP, SGD, JPY, CHF]
          description: Currency of the amount
          example: GBP
        reference:
          type: string
          description: Payment reference (optional)
          example: Invoice #12345

    Payment:
      type: object
      properties:
        paymentId:
          type: string
          example: PAY-20260902-A1B2C3
        status:
          $ref: '#/components/schemas/PaymentStatus'
        sender:
          $ref: '#/components/schemas/PartyInfo'
        receiver:
          $ref: '#/components/schemas/PartyInfo'
        amount:
          type: number
          format: double
          example: 1000
        currency:
          type: string
          example: GBP
        targetAmount:
          type: number
          format: double
          example: 1144.25
        targetCurrency:
          type: string
          example: EUR
        fxRate:
          type: number
          format: double
          example: 1.14425
        feeAmount:
          type: number
          format: double
          example: 16
        totalDebit:
          type: number
          format: double
          example: 1016
        reference:
          type: string
        failureReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentDetails:
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          properties:
            statusHistory:
              type: array
              items:
                $ref: '#/components/schemas/StatusHistoryEntry'
            auditTrail:
              type: array
              items:
                $ref: '#/components/schemas/AuditEvent'

    PartyInfo:
      type: object
      properties:
        accountId:
          type: string
        accountNumber:
          type: string
        bankCode:
          type: string
        name:
          type: string
        country:
          type: string

    PaymentStatus:
      type: string
      enum:
        - INITIATED
        - VALIDATING
        - SCREENING
        - PROCESSING
        - POSTING
        - COMPLETING
        - COMPLETED
        - FAILED
        - REJECTED
        - ON_HOLD

    StatusHistoryEntry:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/PaymentStatus'
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    AuditEvent:
      type: object
      properties:
        eventId:
          type: string
        eventType:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: object

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: payment-processor
        timestamp:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              nullable: true

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

tags:
  - name: Health
    description: Health check endpoints
  - name: Payments
    description: Payment processing operations
